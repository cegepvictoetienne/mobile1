[project]
site_name = "Cours applications mobiles 1"
site_url = "https://mobile1.profinfo.ca"
docs_dir = "wiki"
site_dir = "site"
use_directory_urls = true

nav = [
  {"Page principale" = "index.md"},
  {"Horaire" = "horaire.md"},
  {"Leçons" = [
    {"Créer un projet dans XCode" = "lecons/creer-projet.md"},
  ],
  },
  {"Déclaration de l'utilisation de l'IA" = "declaration-ia.md"},
]

extra_css = ["stylesheets/all.css", "stylesheets/extra.css"]

[project.theme]
name = "material"
custom_dir = "overrides"
logo = "images/logo.svg"
favicon = "images/favicon.svg"
language = "fr"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.plugins]
search = {}
